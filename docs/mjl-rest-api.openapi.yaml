        reason:
          anyOf:
          - {$ref: '#/components/schemas/Reason'}
          - type: 'null'
      required:
      - expected_version
      - label
      - expense_date
      - amount
      - original_id
      - reason
      description: CREATE uses Operation version; UPDATE uses Expense version. original_id and reason
        required for corrections; original_id immutable. null original_id for ordinary expense. Zero uses
        the same approval workflow.
      allOf:
      - if:
          properties:
            original_id:
              type: string
        then:
          properties:
            reason: {$ref: '#/components/schemas/Reason'}
    ExpenseDecision:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: '#/components/schemas/Version'}
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        reason: {$ref: '#/components/schemas/Reason'}
      required:
      - expected_version
      - decision
      description: Expense version. REJECTED requires reason; independent Validator approves correction
        reversal+replacement in one transaction.
      allOf:
      - if:
          properties:
            decision:
              enum:
              - REJECTED
        then:
          required:
          - reason
