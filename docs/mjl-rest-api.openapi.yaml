    ExpenseInput:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: '#/components/schemas/Version'}
        label:
          type: string
          minLength: 1
          maxLength: 255
        expense_date: {$ref: '#/components/schemas/Date'}
        amount: {$ref: '#/components/schemas/Money'}
        original_id:
          anyOf:
          - {$ref: '#/components/schemas/Id'}
