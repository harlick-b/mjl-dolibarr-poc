openapi: 3.1.1
info:
  title: MJL REST API
  version: 0.1.0-draft
  description: Full target contract with authentication, reference screens and Activity workflows implemented (DEC-080/082/083).
    Other operations remain pending. See mjl-rest-api-contract.md for migration state and behavior.
    SessionCookie denotes the native DOLSESSID_ cookie with a deployment-specific suffix;
    browser clients use the server-issued HttpOnly cookie without hard-coding its name.
servers:
- url: /custom/mjlfinancement/api/index.php/v1
  description: Custom-module front controller; PATH_INFO verified in Docker. No native Dolibarr API dependency.
security:
- SessionCookie: []
paths:
  /auth/session:
    get:
      operationId: getSession
      x-implementation-status: implemented
      summary: Session, OTP state and CSRF bootstrap
      tags:
      - Authentication
      x-roles: []
      x-source: custom/mjlfinancement/class/mjlauthcommand.class.php
      x-rollout-stage: 1
      x-submission-token: false
      responses:
        '200':
          description: Session, OTP state and CSRF bootstrap
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data: {$ref: '#/components/schemas/Session'}
                required:
                - data
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '422': {$ref: '#/components/responses/Error422'}
        '503': {$ref: '#/components/responses/Error503'}
        '405': {$ref: '#/components/responses/Error405'}
      description: 200 anonymous for no session; 401 session_expired for expired previously authenticated
        session. This inspection never renews idle timeout.
      security: []
    delete:
      operationId: logout
      x-implementation-status: implemented
      summary: Cancel pending login or log out
      tags:
      - Authentication
      x-roles: []
      x-source: custom/mjlfinancement/class/mjlauthcommand.class.php
      x-rollout-stage: 1
      x-submission-token: false
      responses:
        '204':
          description: Cancel pending login or log out
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
        '405': {$ref: '#/components/responses/Error405'}
      description: CSRF required even for logout. Clear server authentication/pending state and expire
        cookie; no response body.
      security: []
      parameters:
      - {$ref: '#/components/parameters/csrf'}
  /auth/login:
    post:
      operationId: login
      x-implementation-status: implemented
      summary: Verify email/password and begin OTP
      tags:
      - Authentication
      x-roles: []
      x-source: custom/mjlfinancement/class/mjlauthcommand.class.php
      x-rollout-stage: 1
      x-submission-token: false
      responses:
        '202':
          description: Verify email/password and begin OTP
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data: {$ref: '#/components/schemas/Session'}
                required:
                - data
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
        '405': {$ref: '#/components/responses/Error405'}
      description: Native password verifier and failed-login recorder; no protected session until OTP.
        503 authentication_unavailable if OTP is disabled or mail is unavailable.
      security: []
      parameters:
      - {$ref: '#/components/parameters/csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
  /auth/otp/verify:
