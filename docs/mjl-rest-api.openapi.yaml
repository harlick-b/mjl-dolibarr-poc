      operationId: verifyOtp
      x-implementation-status: implemented
      summary: Verify pending OTP
      tags:
      - Authentication
      x-roles: []
      x-source: custom/mjlfinancement/class/mjlauthcommand.class.php
      x-rollout-stage: 1
      x-submission-token: false
      responses:
        '200':
          description: Verify pending OTP
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
