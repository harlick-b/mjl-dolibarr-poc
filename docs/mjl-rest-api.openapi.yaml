      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: '#/components/schemas/Version'}
        decision:
          type: string
          enum:
          - PREVALIDATED
          - RETURNED_SUPERVISOR
          - FINAL_VALIDATED
          - RETURNED_VALIDATOR
        reason: {$ref: '#/components/schemas/Reason'}
        requested_amount:
          anyOf:
          - {$ref: '#/components/schemas/PositiveMoney'}
          - type: 'null'
      required:
      - expected_version
      - decision
      description: expected_version is Activity version. Return requires reason and future Activity start.
        requested_amount only for RETURNED_VALIDATOR. Contributor and prevalidator exclusions remain.
      allOf:
      - if:
          properties:
            decision:
              enum:
              - RETURNED_SUPERVISOR
              - RETURNED_VALIDATOR
        then:
          required:
          - reason
      - if:
          properties:
            decision:
              not:
                const: RETURNED_VALIDATOR
        then:
          properties:
            requested_amount:
              type: 'null'
