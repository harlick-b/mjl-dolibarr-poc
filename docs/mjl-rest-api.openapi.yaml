components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: DOLSESSID_<deployment-suffix>
      description: Documentation placeholder for actual Dolibarr/PHP session_name(); reuse existing private
        adapter, do not create a second session/cookie. Browser manages cookie, never JS/localStorage.
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200000
        default: 1
    cursor:
      name: cursor
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    submission:
      name: X-MJL-Submission
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    query_page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200000
        default: 1
    query_partner_id:
      name: partner_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
    query_project_id:
      name: project_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_activity_id:
      name: activity_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_validation_status:
      name: validation_status
      in: query
      schema: {$ref: '#/components/schemas/ValidationStatus'}
    query_execution_status:
      name: execution_status
      in: query
      schema: {$ref: '#/components/schemas/ExecutionStatus'}
    query_completeness:
      name: completeness
      in: query
      schema: {$ref: '#/components/schemas/Completeness'}
    query_date_from:
      name: date_from
      in: query
      schema: {$ref: '#/components/schemas/Date'}
    query_date_to:
      name: date_to
      in: query
      schema: {$ref: '#/components/schemas/Date'}
    query_cursor:
      name: cursor
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_type_id:
      name: type_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_operation_status:
      name: operation_status
      in: query
      schema: {$ref: '#/components/schemas/OperationStatus'}
    query_type:
      name: type
      in: query
      schema:
        type: string
        enum:
        - CANCELLATION
        - REOPENING
    query_status:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/RequestStatus'}
    query_request_id:
      name: request_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_object_type:
      name: object_type
      in: query
      schema:
        type: string
        maxLength: 100
    query_object_id:
      name: object_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_operation_id:
      name: operation_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_revision_id:
      name: revision_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_actor_id:
      name: actor_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_event_id:
      name: event_id
      in: query
      schema: {$ref: '#/components/schemas/Id'}
    query_target_version:
      name: target_version
      in: query
      schema: {$ref: '#/components/schemas/Version'}
    query_audit_action:
      name: audit_action
      in: query
      schema:
        type: string
        maxLength: 100
    query_result:
      name: result
      in: query
      schema:
        type: string
        enum:
        - SUCCESS
        - DENIED
        - FAILED
    query_direction:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    query_grouping:
      name: grouping
      in: query
      schema:
        type: string
        enum:
        - project
        - partner
        default: project
  responses:
    Error400:
      description: Malformed/unknown input.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error401:
      description: Authentication missing, expired or invalidated.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error403:
      description: Forbidden, CSRF or submission token invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error404:
      description: Missing or inaccessible object, without existence disclosure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error409:
      description: Stale version/fingerprint, invalid transition or concurrency conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error413:
      description: Request body too large.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error415:
      description: Unsupported request content type.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error422:
      description: Valid JSON but invalid business input or selection limit.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error429:
      description: Authentication throttled; Retry-After where disclosed safely.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
    Error503:
      description: Unavailable; no internal error details. Outcome may be uncertain; do not automatically
        retry mutations.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error405:
      description: Unsupported method; Allow header lists supported methods.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: Canonical positive decimal, at most 9223372036854775807; never a JSON number.
    Version:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: Canonical positive decimal, at most 9223372036854775807; never a JSON number.
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: Exact XOF integer, at most 9223372036854775807. No decimal point or separators.
    PositiveMoney:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: Positive exact XOF integer, at most 9223372036854775807.
    SignedMoney:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)$
    Date:
      type: string
      format: date
    Timestamp:
      type: string
      format: date-time
    Reason:
      type: string
      minLength: 1
      maxLength: 2000
    Fingerprint:
      type: string
      pattern: ^[a-f0-9]{64}$
    BusinessRole:
      type: string
      enum:
