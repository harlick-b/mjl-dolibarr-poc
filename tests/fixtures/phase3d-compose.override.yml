services:
  mariadb:
    volumes: !override
      - type: bind
        source: ${MJL_E2E_DB_DIR}
        target: /var/lib/mysql

  dolibarr:
    environment:
      DOLI_URL_ROOT: ${MJL_BASE_URL}
    ports: !override
      - target: 80
        published: ${MJL_E2E_PORT}
        protocol: tcp
    volumes: !override
      - type: bind
        source: ${MJL_E2E_DOCS_DIR}
        target: /var/www/documents
      - type: bind
        source: ${PWD}/custom
        target: /var/www/html/custom
      - type: bind
        source: ${PWD}/custom/mjlfinancement/deployment/apache-native-guard.conf
        target: /etc/apache2/conf-enabled/mjl-native-guard.conf
        read_only: true
