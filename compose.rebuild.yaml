services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${MJL_FRONTEND_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${MJL_BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mjl}:${POSTGRES_PASSWORD:?Set a local generated POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mjl_foundation}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mjl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local generated POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mjl_foundation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
