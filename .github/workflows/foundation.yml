name: Rebuild foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      COMPOSE_FILE: compose.rebuild.yaml:.github/compose.connected-tests.yaml
      COMPOSE_PROJECT_NAME: mjl-foundation-ci
      COMPOSE_ENV_FILES: .env.ci
      API_PROXY_TARGET: http://127.0.0.1:8013
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create disposable configuration
        run: |
          umask 077
          policy="$RUNNER_TEMP/mjl-connected-test-policy.json"
          key="$(openssl rand -hex 32)"
          cat > "$policy" <<EOF
          {
            "fixture": "a1-synthetic-v1",
            "password_min": 8,
            "invitation_seconds": 604800,
            "otp_seconds": 600,
            "otp_attempts": 5,
            "otp_lock_seconds": 600,
            "resend_seconds": 60,
            "resend_max": 3,
            "context_seconds": 900,
            "login_window_seconds": 900,
            "login_limit": 10,
            "ip_window_seconds": 60,
            "ip_limit": 120,
            "concurrent_sessions": "independent-test-only",
            "origin": "http://127.0.0.1:4173",
            "key": "$key",
            "mailbox": "/tmp/mjl-a1-mail-connected-ci",
            "lifecycle_database": "mjl_test_foundation",
            "recovery_fixture": "TEST_ONLY",
            "recovery_seconds": 600,
            "recovery_email_window_seconds": 600,
            "recovery_email_limit": 3,
            "recovery_ip_window_seconds": 60,
            "recovery_ip_limit": 20,
            "planning_lifecycle_fixture": "SYNTHETIC_EXECUTION_TEST_ONLY"
          }
          EOF
          chmod 0644 "$policy"
          echo "MJL_CONNECTED_POLICY_HOST=$policy" >> "$GITHUB_ENV"
          echo 'MJL_CONNECTED_PLANNING_MAILBOX=/tmp/mjl-a1-mail-connected-ci' >> "$GITHUB_ENV"
          echo 'MJL_CONNECTED_PLANNING_CONTAINER=mjl-foundation-ci-backend-1' >> "$GITHUB_ENV"
          echo 'MJL_CONNECTED_PLANNING_DATABASE=mjl_test_foundation' >> "$GITHUB_ENV"
          echo 'MJL_REQUIRE_CONNECTED_PLANNING=1' >> "$GITHUB_ENV"
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo 'POSTGRES_DB=mjl_test_foundation'
            echo 'POSTGRES_USER=mjl'
            echo 'MJL_FRONTEND_PORT=5183'
            echo 'MJL_BACKEND_PORT=8013'
          } > .env.ci
      - name: Start isolated services
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait
          docker compose exec -T backend alembic upgrade head
      - name: Frontend quality
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend run format:check
          npm --prefix frontend run lint:css
          npm --prefix frontend run test:unit
          npm --prefix frontend run build
      - name: Backend quality and PostgreSQL integration
        run: |
          docker compose exec -T backend ruff check .
          docker compose exec -T backend ruff format --check .
          docker compose exec -T backend mypy app
          docker compose exec -T backend sh -c 'TEST_DATABASE_URL="$DATABASE_URL" pytest -q'
      - name: Browser integration and PWA
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- e2e/planning/activity-submission.spec.js
          npm run test:e2e -- --grep-invert 'assigned Agent submits an Activity for Supervisor review'
      - name: Remove only the disposable CI project
        if: always()
        run: docker compose down --volumes --remove-orphans
